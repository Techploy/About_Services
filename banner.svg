<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Techploy - Ideas, Websites, Solutions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.5" stop-color="#1C1248"/>
      <stop offset="1" stop-color="#0A0F1E"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animate attributeName="x1" values="200;700;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;1000;500" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.14" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>

  <!-- Floating glow orbs -->
  <circle cx="150" cy="90" r="90" fill="#3B82F6" opacity="0.28" filter="url(#blur)">
    <animate attributeName="cx" values="150;280;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;160;90" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="80" r="100" fill="#EC4899" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cx" values="860;730;860" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;170;80" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="260" r="110" fill="#8B5CF6" opacity="0.25" filter="url(#blur)">
    <animate attributeName="cx" values="420;580;420" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="120" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="90" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="25" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="35" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="95" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="30" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="115" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.2s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="50" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="205" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="210" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="255" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="248" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="18" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.4s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="270" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shooting star -->
  <g>
    <line x1="0" y1="0" x2="-80" y2="-16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="-120 30;1120 170" dur="7s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- Rotating rings -->
  <g transform="translate(500,140)" fill="none" stroke-linecap="round">
    <circle r="122" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle r="142" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="34 20 4 20">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" repeatCount="indefinite"/>
    <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#tg)" filter="url(#glow)">Techploy
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="8" fill="#C9D1D9" opacity="0">IDEAS  |  WEBSITES  |  SOLUTIONS
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-style="italic" fill="#A78BFA">From Idea to Website
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Waves -->
  <path d="M0 292 q50 -26 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V320 H0 Z" fill="url(#w1)" opacity="0.40">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M-200 298 q50 -22 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V320 H-200 Z" fill="url(#w2)" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
