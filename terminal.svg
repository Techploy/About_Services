<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Terminal typing out what Techploy does" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animate attributeName="x1" values="0;800;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="400;1200;400" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- one clip per line; each reveals left to right, holds, then resets (16s loop) -->
    <clipPath id="c1"><rect x="40" y="62" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.03125;0.08125;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.1125;0.2;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="122" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.2125;0.2875;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="152" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.3125;0.4125;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="182" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.425;0.5125;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="212" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.5375;0.6125;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c7"><rect x="40" y="242" width="0" height="28"><animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.6375;0.7375;0.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="798" height="318" rx="14" fill="#0D1117" stroke="url(#border)" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h770a14 14 0 0 1 14 14v25H1z" fill="#161B22"/>
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="21" r="6" fill="#27C93F"/>
  <text x="400" y="26" text-anchor="middle" font-family="Fira Code, JetBrains Mono, Menlo, Consolas, monospace" font-size="13" fill="#8B949E">techploy@studio: ~</text>

  <g font-family="Fira Code, JetBrains Mono, Menlo, Consolas, monospace" font-size="16">
    <text x="40" y="82"  clip-path="url(#c1)" fill="#C9D1D9"><tspan fill="#22C55E">$</tspan> whoami</text>
    <text x="40" y="112" clip-path="url(#c2)" fill="#A78BFA">&gt; Techploy  |  Ideas  |  Websites  |  Solutions</text>
    <text x="40" y="142" clip-path="url(#c3)" fill="#C9D1D9"><tspan fill="#22C55E">$</tspan> cat services.txt</text>
    <text x="40" y="172" clip-path="url(#c4)" fill="#60A5FA">&gt; College Projects  |  Custom Websites  |  Portfolios &amp; Resumes</text>
    <text x="40" y="202" clip-path="url(#c5)" fill="#60A5FA">&gt; Business Web Pages  |  Individual Solutions</text>
    <text x="40" y="232" clip-path="url(#c6)" fill="#C9D1D9"><tspan fill="#22C55E">$</tspan> ./launch --idea</text>
    <text x="40" y="262" clip-path="url(#c7)" fill="#EC4899">&gt; Idea → Design → Develop → Launch   [ DONE ]</text>

    <!-- prompt + blinking cursor -->
    <text x="40" y="296" fill="#22C55E">$</text>
    <rect x="58" y="282" width="10" height="18" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
