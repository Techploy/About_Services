<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animate attributeName="x1" values="0;1000;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;1500;500" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="40" y="11" width="920" height="2" rx="1" fill="url(#g)" opacity="0.9"/>

  <!-- end diamonds -->
  <rect x="32" y="4" width="16" height="16" rx="2" transform="rotate(45 40 12)" fill="none" stroke="#8B5CF6" stroke-width="1.5">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="952" y="4" width="16" height="16" rx="2" transform="rotate(45 960 12)" fill="none" stroke="#3B82F6" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- travelling spark -->
  <circle r="4.5" cy="12" fill="#FFFFFF" filter="url(#glow)">
    <animate attributeName="cx" values="40;960;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
